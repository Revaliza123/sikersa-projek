<!doctype html>
<html
  lang="en"
  theme="lembang"
  theme-mode="light"
  theme-fontsize="large"
  data-maps="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- OG Meta Tags to improve the way the post looks when you share the page on LinkedIn, Facebook, Google+ -->
    <meta property="og:site_name" content="ID Desa" />
    <!-- website name -->
    <meta property="og:site" content="http://localhost" />
    <!-- website link -->
    <meta property="og:title" content="ID Desa" />
    <!-- title shown in the actual shared post -->
    <meta property="og:description" content="" />
    <!-- description shown in the actual shared post -->
    <meta property="og:image" content="" />
    <!-- image link, make sure it's jpg -->
    <meta property="og:url" content="" />
    <!-- where do you want your post to link to -->
    <meta property="og:type" content="article" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/logo-sikersas.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/logo-sikersas.png" />
    <link rel="mask-icon" href="/static/logo-sikersas.png" color="#000000" />
    <link rel="shortcut icon" href="/static/logo-sikersas.png" />

    <meta name="description" content="ID Desa System" />
    <title>Sikersa</title>
  </head>

  <body theme-color="sidesa" theme-shape="rounded">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
